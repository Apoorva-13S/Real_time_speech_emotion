<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Speech Emotion Demo</title>
<style>
  :root { color-scheme: light dark; --fg:#16181d; --bg:#f6f7f9; --card:#fff;
          --line:#dfe3e8; --accent:#2b6cb0; --muted:#606a76; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e9ee; --bg:#12151a; --card:#1a1f27; --line:#2b3240;
            --accent:#64a0e8; --muted:#9aa4b2; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 18px 60px; background:var(--bg); color:var(--fg);
         font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:1.45rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:16px; }
  button { font:inherit; padding:10px 18px; border-radius:9px; cursor:pointer;
           border:1px solid var(--accent); background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:transparent; color:var(--accent); }
  #status { margin-top:12px; font-size:.9rem; color:var(--muted); white-space:pre-wrap; }
  .bars { margin-top:6px; }
  .row { display:grid; grid-template-columns:110px 1fr 56px; gap:10px;
         align-items:center; margin:7px 0; font-size:.9rem; }
  .track { background:var(--line); border-radius:99px; height:10px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); width:0; transition:width .4s; }
  .row.top .fill { background:#2f9e44; }
  .row.top { font-weight:600; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem; }
  .warn { border-left:3px solid #e8a33d; padding-left:12px; color:var(--muted);
          font-size:.86rem; }
  audio { width:100%; margin-top:10px; }
  .badge { display:inline-block; font-size:.75rem; padding:2px 8px; border-radius:99px;
           border:1px solid var(--line); color:var(--muted); margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Speech Emotion Recognition <span class="badge" id="modelBadge">checking…</span></h1>
  <p class="sub">Upload a short clip (WAV works best, 2–6 s), or record one below.</p>

  <div class="card">
    <input type="file" id="file" accept="audio/*" />
    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="go" disabled>Analyse</button>
      <button id="rec" class="secondary">Record 4 s</button>
    </div>
    <audio id="player" controls hidden></audio>
    <div id="status">Ready.</div>
  </div>

  <div class="card" id="resultCard" hidden>
    <div style="display:flex; justify-content:space-between; align-items:baseline;">
      <strong id="topLabel">–</strong>
      <span class="mono" id="topScore"></span>
    </div>
    <div class="bars" id="bars"></div>
    <p class="warn" style="margin-top:14px;">
      Trained on acted speech from 24 actors. Predictions are estimates from
      acoustics, not a measurement of anyone's real emotional state.
    </p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let blob = null, modelReady = false, fallback = false;

async function health() {
  try {
    const r = await fetch('/healthz', { cache: 'no-store' });
    const j = await r.json();
    modelReady = !!j.model_loaded;
    fallback = !!j.fallback_model;
    $('modelBadge').textContent = modelReady
      ? (fallback ? 'public fallback model' : 'trained model')
      : 'no model loaded';
    if (!modelReady) {
      $('status').textContent = 'Server has no model yet.\n' + (j.error || '') +
        '\nTrain one (see process.txt), then restart with --model runs/local/best';
    }
  } catch (e) {
    $('status').textContent = 'Cannot reach the server: ' + e.message;
  }
  updateGo();
}

function updateGo() { $('go').disabled = !(blob && modelReady); }

$('file').addEventListener('change', (e) => {
  blob = e.target.files[0] || null;
  if (blob) {
    $('player').src = URL.createObjectURL(blob);
    $('player').hidden = false;
    $('status').textContent = `Selected ${blob.name} (${(blob.size/1024).toFixed(0)} KB)`;
  }
  updateGo();
});

$('rec').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    $('status').textContent = 'Recording for 4 seconds — speak now…';
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => {
      blob = new Blob(chunks, { type: rec.mimeType });
      $('player').src = URL.createObjectURL(blob);
      $('player').hidden = false;
      $('status').textContent = 'Recording captured. Click Analyse.';
      updateGo();
      stream.getTracks().forEach(t => t.stop());
    };
    rec.start();
    setTimeout(() => rec.stop(), 4000);
  } catch (e) {
    $('status').textContent =
      'Microphone unavailable: ' + e.message +
      '\nOn iOS Safari this needs HTTPS; on desktop allow mic access.';
  }
});

$('go').addEventListener('click', async () => {
  if (!blob) return;
  $('go').disabled = true;
  $('status').textContent = 'Analysing…';
  const fd = new FormData();
  fd.append('file', blob, blob.name || 'clip.wav');
  try {
    const r = await fetch('/predict', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    render(j);
    $('status').textContent = `Analysed ${j.file || 'clip'}` +
      (j.duration_s ? ` (${j.duration_s}s)` : '');
  } catch (e) {
    $('status').textContent = 'Failed: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});

function render(j) {
  $('resultCard').hidden = false;
  $('topLabel').textContent = j.top.label;
  $('topScore').textContent = (j.top.score * 100).toFixed(1) + '%';
  const bars = $('bars');
  bars.innerHTML = '';
  for (const p of j.predictions) {
    const row = document.createElement('div');
    row.className = 'row' + (p.label === j.top.label ? ' top' : '');
    row.innerHTML = `<span>${p.label}</span>
      <span class="track"><span class="fill" style="width:${(p.score*100).toFixed(1)}%"></span></span>
      <span class="mono">${(p.score*100).toFixed(1)}%</span>`;
    bars.appendChild(row);
  }
}

health();
</script>
</body>
</html>
