[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ser-ravdess"
version = "1.0.0"
description = "Speech emotion recognition on xbgoose/ravdess with wav2vec2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.3",
  "soundfile>=0.12,<0.15",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.1,<3",
  "transformers>=4.40,<5",
  "datasets>=2.19,<3.6",
  "accelerate>=0.30",
  "huggingface_hub>=0.23",
  "librosa>=0.10.1,<0.11",
  "scikit-learn>=1.3,<1.6",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]
demo = ["sounddevice>=0.4.6"]
dev = ["pytest>=7.4"]

[project.scripts]
ser = "ser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
